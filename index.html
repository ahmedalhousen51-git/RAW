<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAW — مطبخ الكافيه ثلاثي الأبعاد</title>
<meta name="description" content="تجربة تفاعلية ثلاثية الأبعاد لمطبخ كافيه RAW: امشي جوه المكان، اقترب من المحطات، وشغّل الماكينات.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/raw-ui.css">
</head>
<body>

<header class="raw-top">
  <div class="raw-brand"><b>RAW</b><span>كافيه ومحمصة</span></div>
  <div class="raw-tagline">امشي في المطبخ</div>
</header>

<div class="raw-wrap" id="wrap">
  <div id="stage"></div>

  <aside class="raw-stock">
    <h3>المخزون</h3>
    <div id="stock"></div>
    <div class="raw-rank" id="rank" title="مستواك وإتقانك">—</div>
    <button type="button" class="raw-sound" id="time" title="غيّر وقت اليوم">الوقت: —</button>
    <button type="button" class="raw-sound" id="sound" aria-pressed="true" title="الصوت شغّال">الصوت: شغّال</button>
  </aside>

  <div class="raw-help">
    <b>الأسهم</b> أو <b>WASD</b> للمشي<br>
    <b>دوس على الأرض</b> تروح لنقطة<br>
    <b>دوس على ماكينة</b> تفتح محطتها
  </div>

  <div class="raw-rotate">لفّ الموبايل بالعرض عشان تشوف المطبخ كله</div>

  <div class="raw-cup" id="cup" hidden>
    <span id="cupTemp">—</span><i></i><span id="cupFill">—</span><i></i><span id="cupIce">—</span>
    <button type="button" id="serveBtn" hidden>قدّم المشروب</button>
  </div>

  <div class="raw-tag" id="tag"></div>

  <section class="raw-hud" id="hud" aria-live="polite"></section>

  <div class="raw-nora" id="nora" data-mood="calm">
    <div class="face">
      <svg viewBox="0 0 48 48" width="46" height="46" aria-hidden="true">
        <circle cx="24" cy="27" r="14" fill="#E8C49E"/>
        <path d="M10 24a14 14 0 0 1 28 0v-2a14 14 0 0 0-28 0z" fill="#241A14"/>
        <path d="M10 24c0-9 6-14 14-14s14 5 14 14c0-5-5-8-14-8s-14 3-14 8z" fill="#241A14"/>
        <circle cx="38" cy="18" r="5" fill="#241A14"/>
        <circle cx="19" cy="27" r="2.2" fill="#1F1B18"/>
        <circle cx="29" cy="27" r="2.2" fill="#1F1B18"/>
        <path d="M19.5 33.5q4.5 4 9 0" stroke="#1F1B18" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M24 41c7 0 11 3 12 7H12c1-4 5-7 12-7z" fill="#2E5A4B"/>
      </svg>
    </div>
    <div class="bubble" id="noraText">—</div>
  </div>

  <div class="raw-toasts" id="toasts"></div>

  <div class="raw-load" id="load"><i></i><span>بجهّز مطبخ RAW…</span></div>

  <div class="raw-fallback" id="fallback">
    <h2>الجهاز ده مش شايل الرسم ثلاثي الأبعاد</h2>
    <p>محتاج متصفح حديث بيدعم WebGL عشان تفتح مطبخ RAW.</p>
  </div>
</div>

<script src="assets/raw-materials.js"></script>
<script src="assets/raw-fx.js"></script>
<script src="assets/raw-lighting.js"></script>
<script src="assets/raw-room.js"></script>
<script src="assets/raw-stations.js"></script>
<script src="assets/raw-character.js"></script>
<script src="assets/raw-drink.js"></script>
<script src="assets/raw-atmos.js"></script>
<script src="assets/raw-camera.js"></script>
<script src="assets/raw-progress.js"></script>
<script src="assets/raw-consoles.js"></script>
<script src="assets/raw-sfx.js"></script>
<script src="assets/raw-ui.js"></script>
<script src="assets/raw-console-ui.js"></script>
<script src="assets/raw-serve.js"></script>
<script src="assets/raw-kitchen.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const wrap = $('wrap');
  const els = {
    stock: $('stock'), tag: $('tag'), sound: $('sound'),
    hud: $('hud'), nora: $('nora'), noraText: $('noraText'), toasts: $('toasts')
  };

  const done = () => $('load').classList.add('gone');
  const giveUp = () => { $('stage').style.display = 'none'; $('fallback').style.display = 'block'; done(); };

  if (!RAW.kitchen.supported()) { giveUp(); return; }

  let api = null;
  const setFocusMode = on => wrap.classList.toggle('focus', on);

  const ui = RAW.ui(els, {
    // زرار من المخزون = طلب مقصود: تمشي للمحطة وتتفتح لوحتها لما توصل
    onPick(stationId) {
      RAW.sfx.click();
      if (api) api.goTo(stationId);
    }
  });

  /* لوحة تحكّم الماكينة: بتشغّل الماكينة في المشهد، وبتصبّ في الكوباية،
     وبتخلّي نورة تعلّق على النتيجة. */
  const serveCard = RAW.serve(wrap, {
    onServe(total, name, badges) {
      if (api) { api.newCup(); api.express(total >= 78 ? 'happy' : 'oops', 2.2); }
      hud.toast('اتقدّم! درجة الجودة ' + total, total >= 78 ? 'good' : 'warn');
      hud.say(name ? ('«' + name + '» — ' + total + ' من ١٠٠') : ('المشروب اتقدّم بدرجة ' + total),
              total >= 78 ? 'happy' : 'calm');
      badges.forEach((b, i) => setTimeout(() => hud.toast('🏅 إنجاز: ' + b.name, 'good'), 600 + i * 600));
      paintRank();
    }
  });

  function paintRank() {
    const p = RAW.progress;
    $('rank').textContent = p.level.name + ' · إتقان ' + p.mastery() + '٪';
  }

  const hud = RAW.console(els, {
    onRun(station, spec) {
      if (!api) return;
      api.use(station.id);                       // لمبة الماكينة والبخار والصوت
      if (spec.action.sound && RAW.sfx) RAW.sfx.machine(spec.action.sound);
      api.express('calm', 0.2);
    },
    onDone(station, spec, values, rating) {
      if (!api) return;
      api.serve(station.id, spec, values);       // اللي اتعمل بينزل في الكوباية
      serveCard.add(station.id, rating);         // بتتحسب في درجة المشروب النهائي
      paintRank();
      if (rating === 'bad') { RAW.sfx.error(); api.express('oops', 2); }
      else { RAW.sfx.confirm(); api.express('happy', 2.4); }
    },
    onError(station) {
      RAW.sfx.error();
      if (api) api.express('oops', 1.6);
    },
    // بعد عملية ناجحة الكاميرا بترجع للمطبخ لوحدها
    onFinish() {
      hud.close();
      setFocusMode(false);
      if (api) { api.cupTo(null); api.unfocus(); }
    },
    onClose() {
      setFocusMode(false);
      if (api) { api.cupTo(null); api.unfocus(); }
    },
    onPower() {},
    onValue() {}
  });

  window.RAWHud = hud;                     // للتشخيص ولربط صفحات تانية
  window.RAWServe = serveCard;

  // زرار الصوت بيغيّر نصّه وبيشغّل/يقفل همهمة المكان
  els.sound.addEventListener('click', () => {
    els.sound.textContent = RAW.sfx.on ? 'الصوت: شغّال' : 'الصوت: مقفول';
    RAW.sfx.ambience(RAW.sfx.on);
  });

  // وقت اليوم: الصبح · الضهر · المغرب · الليل
  $('time').addEventListener('click', () => {
    if (!api) return;
    RAW.sfx.click();
    $('time').textContent = 'الوقت: ' + api.nextTime();
  });

  RAW.kitchen.mount($('stage'), {
    // الاقتراب بيوري اسم المحطة والكاميرا بتقرّب — من غير ما تفتح لوحة
    onStation(st) {
      ui.setNear(st, st ? 'دوس على الماكينة أو اضغط E' : '');
      if (!st && hud.isOpen()) { hud.close(); setFocusMode(false); if (api) api.cupTo(null); }
    },
    // الوصول بعد طلب مقصود بيفتح لوحة تحكّم الماكينة
    onArrive(st) {
      hud.open(st);
      setFocusMode(true);
      if (api) api.cupTo(st.id);
    },
    onInteract(st) {
      if (hud.busy()) return;                    // مش بنقفل والماكينة شغّالة
      if (hud.isOpen()) { hud.close(); setFocusMode(false); if (api) { api.cupTo(null); api.unfocus(); } }
      else { hud.open(st); setFocusMode(true); if (api) { api.cupTo(st.id); api.refocus(); } }
    },
    onOperate(st) {
      const spec = RAW.consoles[st.id];
      ui.say(st, (spec && spec.action.busy) || 'شغّالة…');
    },
    onEscape() {
      if (hud.busy()) return;
      if (hud.isOpen()) { hud.close(); setFocusMode(false); if (api) { api.cupTo(null); api.unfocus(); } }
    },
    onTick(dt) { hud.tick(dt); }
  }).then(a => {
    api = a;
    if (!a) { giveUp(); return; }
    window.RAWKitchen = a;                 // للتشخيص ولربط صفحات تانية
    // ?go=espresso يمشي لها · ?at=espresso يبدأ عندها
    $('time').textContent = 'الوقت: ' + a.timeName();

    // قراءة حالة المشروب: بتظهر أول ما يبقى في الكوباية حاجة
    const cupBox = $('cup');
    setInterval(() => {
      const d = a.drink();
      if (d.level <= 0.01 && !d.ice) { cupBox.hidden = true; return; }
      cupBox.hidden = false;
      $('cupTemp').textContent = d.temp + '°م';
      $('cupFill').textContent = Math.round(d.level * 100) + '%';
      $('cupIce').textContent = d.ice ? d.ice + ' تلج' : 'من غير تلج';
      // التقديم بيتفتح لما يبقى في الكوباية حاجة تستاهل
      $('serveBtn').hidden = !(d.level >= 0.15 && serveCard.count() > 0);
    }, 500);

    paintRank();
    // نورة بترحّب حسب تاريخك معاها
    els.nora.classList.add('on');
    els.noraText.textContent = RAW.progress.greeting();
    setTimeout(() => { if (!hud.isOpen() && !serveCard.isOpen) els.nora.classList.remove('on'); }, 6000);

    $('serveBtn').addEventListener('click', () => {
      RAW.sfx.click();
      els.nora.classList.add('on');
      serveCard.show(a.drink());
    });

    // أول تفاعل من المستخدم هو اللي بيسمح بتشغيل الصوت في المتصفح
    addEventListener('pointerdown', () => RAW.sfx.ambience(RAW.sfx.on), { once: true });

    const q = new URLSearchParams(location.search);
    if (q.get('at')) a.place(q.get('at'));
    else if (q.get('go')) a.goTo(q.get('go'));
    done();
  }).catch(err => {
    console.error('RAW: mount failed —', err);
    giveUp();
  });
})();
</script>
</body>
</html>
